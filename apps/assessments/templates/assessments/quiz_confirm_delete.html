{% extends "base.html" %}

{% block title %}Delete Quiz{% endblock %}

{% block content %}
<section class="panel">
  <div class="panel-header">
    <div>
      <h1>Delete Quiz</h1>
      <p class="muted">This will permanently remove the quiz, its questions, assignments, and learner attempt records.</p>
    </div>
    <a class="button button-secondary" href="{% url 'quiz-list' %}">Cancel</a>
  </div>

  <form method="post" class="stack">
    {% csrf_token %}
    <p>Are you sure you want to delete <strong>{{ object.title }}</strong>?</p>
    <button class="button button-danger" type="submit">Delete Quiz</button>
  </form>
</section>
{% endblock %}
