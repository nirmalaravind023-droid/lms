{% extends "base.html" %}

{% block title %}Delete Lesson{% endblock %}

{% block content %}
<section class="panel">
  <div class="panel-header">
    <div>
      <h1>Delete Lesson</h1>
      <p class="muted">This removes the lesson from the module.</p>
    </div>
    <a class="button button-secondary" href="{% url 'course-builder' object.module.course.slug %}">Back To Builder</a>
  </div>

  <form method="post" class="stack">
    {% csrf_token %}
    <p>Are you sure you want to delete <strong>{{ object.title }}</strong>?</p>
    <button class="button button-danger" type="submit">Delete Lesson</button>
  </form>
</section>
{% endblock %}
