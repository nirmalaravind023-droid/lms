version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run streamlit_dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    depends_on:
      - db

volumes:
  postgres_data:

